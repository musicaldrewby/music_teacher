<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Mr. Drew’s Pocket Orff: touch-friendly xylophones, metallophones, glockenspiel, triangle, güiro, and claves.">
    <title>Mr. Drew's Pocket Orff</title>
    <link rel="stylesheet" href="./assets/fonts/fonts.css">
    
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div id="rotate-overlay">
        <div class="rotate-msg"><p>PLEASE TURN SIDEWAYS</p><button class="back-btn" onclick="goHome()">← Menu</button></div>
    </div>

    <div id="main-menu">
        <div class="header">
            <h1>Mr. Drew's Pocket Orff</h1>
            <p class="menu-credit">Created by Drew Wichman</p>
        </div>

        <div class="section-label">Wooden Bars</div>
        <div class="grid-container">
            <button type="button" class="card accent-wood" onclick="loadInstrument('xylo_bass')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Bass</span><span>Deep Resonance</span>
            </button>
            <button type="button" class="card accent-wood" onclick="loadInstrument('xylo_alto')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Alto</span><span>Warm Oak</span>
            </button>
            <button type="button" class="card accent-wood wide-card" onclick="loadInstrument('xylo_sop')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Soprano</span><span>Bright Maple</span>
            </button>
        </div>

        <div class="section-label">Metal Bars</div>
        <div class="grid-container">
            <button type="button" class="card accent-metal" onclick="loadInstrument('met_bass')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Bass</span><span>Silver Sustain</span>
            </button>
            <button type="button" class="card accent-metal" onclick="loadInstrument('met_alto')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Alto</span><span>Pure Tone</span>
            </button>
            <button type="button" class="card accent-metal" onclick="loadInstrument('met_sop')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Soprano</span><span>Shimmer</span>
            </button>
            <button type="button" class="card accent-gold" onclick="loadInstrument('glock')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Glockenspiel</span><span>Bright Chime</span>
            </button>
        </div>

        <div class="section-label">Unpitched Percussion</div>
        <div class="grid-container">
            <button type="button" class="card accent-perc" onclick="loadInstrument('perc_triangle')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Triangle</span>
            </button>
            <button type="button" class="card accent-perc" onclick="loadInstrument('perc_guiro')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Güiro</span>
            </button>
            <button type="button" class="card accent-perc wide-card" onclick="loadInstrument('perc_claves')">
                <span class="icon-bg" aria-hidden="true"></span><span class="card-title">Claves</span>
            </button>
        </div>
    </div>

    <div id="instrument-view">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">&#8592; Menu</button>
            <span id="inst-title">Instrument</span>
            <button aria-pressed="false" id="damper-btn" class="damper-toggle" onclick="toggleDamper()">Damper</button>
        </div>
        
        <div id="instrument-container"></div>
        <p id="playing-hint" aria-live="polite"></p>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
