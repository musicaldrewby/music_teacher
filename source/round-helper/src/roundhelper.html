<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Helper</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts: Space Grotesk for that geometric feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ============ THEME DEFINITIONS ============ */
        body[data-theme="classic"] {
            --c-surface:#ffffff; --c-border:#000000; --c-shadow:#000000; --c-text:#000000; --c-text-soft:#57534e; --c-on-accent:#000000;
            --c-badge:#facc15; --c-decor:#f472b6; --c-bar:#5eead4; --c-sound-on:#86efac; --c-sound-off:#fca5a5;
            --c-play-idle:#f472b6; --c-play-active:#facc15; --c-flash-a:#f472b6; --c-flash-b:#facc15;
            --c-track-idle:#e2e8f0; --c-input-shadow:#cbd5e1;
            --c-accent-1:#F472B6; --c-accent-2:#22D3EE; --c-accent-3:#FACC15; --c-accent-4:#A78BFA;
            --c-invert-bg:#000000; --c-invert-text:#ffffff;
            --c-border-width:3px; --c-shadow-offset:6px; --c-radius:0px;
            background-color:#fff1f2;
            background-image: radial-gradient(#000 10%, transparent 11%), radial-gradient(#000 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        body[data-theme="midnight"] {
            --c-surface:#1D1F29; --c-border:#F2F0E6; --c-shadow:#A3E635; --c-text:#F2F0E6; --c-text-soft:#8A8A99; --c-on-accent:#14151C;
            --c-badge:#A3E635; --c-decor:#FB7185; --c-bar:#22D3EE; --c-sound-on:#4ADE80; --c-sound-off:#F87171;
            --c-play-idle:#FB7185; --c-play-active:#A3E635; --c-flash-a:#FB7185; --c-flash-b:#A3E635;
            --c-track-idle:#4B4E5C; --c-input-shadow:#3A3D4A;
            --c-accent-1:#A3E635; --c-accent-2:#22D3EE; --c-accent-3:#FB7185; --c-accent-4:#C084FC;
            --c-invert-bg:#F2F0E6; --c-invert-text:#14151C;
            --c-border-width:3px; --c-shadow-offset:6px; --c-radius:0px;
            background-color:#14151C;
            background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: 0 0;
        }
        body[data-theme="riso"] {
            --c-surface:#FBF8F1; --c-border:#1A1A1A; --c-shadow:#1A1A1A; --c-text:#1A1A1A; --c-text-soft:#6E6A60; --c-on-accent:#1A1A1A;
            --c-badge:#FFB627; --c-decor:#FF48B0; --c-bar:#5FBFAE; --c-sound-on:#2FA36B; --c-sound-off:#E8433D;
            --c-play-idle:#FF48B0; --c-play-active:#FFB627; --c-flash-a:#FF48B0; --c-flash-b:#FFB627;
            --c-track-idle:#E2DBCB; --c-input-shadow:#E2DBCB;
            --c-accent-1:#FF48B0; --c-accent-2:#0F7EC4; --c-accent-3:#FFB627; --c-accent-4:#3FA796;
            --c-invert-bg:#1A1A1A; --c-invert-text:#F4EFE3;
            --c-border-width:3px; --c-shadow-offset:6px; --c-radius:0px;
            background-color:#F4EFE3;
            background-image: radial-gradient(#E2DBCB 10%, transparent 11%), radial-gradient(#E2DBCB 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        body[data-theme="terracotta"] {
            --c-surface:#FAF4E7; --c-border:#2A211C; --c-shadow:#2A211C; --c-text:#2A211C; --c-text-soft:#7A6A5C; --c-on-accent:#2A211C;
            --c-badge:#E0A03C; --c-decor:#C1543A; --c-bar:#6BAFA8; --c-sound-on:#5B8C5A; --c-sound-off:#C1543A;
            --c-play-idle:#C1543A; --c-play-active:#E0A03C; --c-flash-a:#C1543A; --c-flash-b:#E0A03C;
            --c-track-idle:#DDD0BB; --c-input-shadow:#DDD0BB;
            --c-accent-1:#C1543A; --c-accent-2:#1F6F6B; --c-accent-3:#E0A03C; --c-accent-4:#6B5B95;
            --c-invert-bg:#2A211C; --c-invert-text:#EDE3D2;
            --c-border-width:3px; --c-shadow-offset:6px; --c-radius:0px;
            background-color:#EDE3D2;
            background-image: radial-gradient(#DDD0BB 10%, transparent 11%), radial-gradient(#DDD0BB 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        body[data-theme="deepwater"] {
            --c-surface:#16223B; --c-border:#3A4A66; --c-shadow:#3A4A66; --c-text:#E8F1FF; --c-text-soft:#7C8CA8; --c-on-accent:#101A2E;
            --c-badge:#2DD4BF; --c-decor:#818CF8; --c-bar:#2DD4BF; --c-sound-on:#34D399; --c-sound-off:#F87171;
            --c-play-idle:#818CF8; --c-play-active:#2DD4BF; --c-flash-a:#818CF8; --c-flash-b:#2DD4BF;
            --c-track-idle:#3E5273; --c-input-shadow:#1E2C47;
            --c-accent-1:#2DD4BF; --c-accent-2:#818CF8; --c-accent-3:#FDE68A; --c-accent-4:#F472B6;
            --c-invert-bg:#E8F1FF; --c-invert-text:#101A2E;
            --c-border-width:1px; --c-shadow-offset:2px; --c-radius:12px;
            background-color:#101A2E;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: 0 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--c-surface); border-left: 2px solid var(--c-border); }
        ::-webkit-scrollbar-thumb { background: var(--c-border); border: 2px solid var(--c-surface); }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-shadow); }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        
        .animate-wiggle:hover {
            animation: wiggle 0.3s ease-in-out infinite;
        }
        
        /* Beat Flash Animations (now theme-driven) */
        @keyframes flash-fill-a {
            0% { fill: var(--c-flash-a); }
            100% { fill: var(--c-surface); }
        }
        @keyframes flash-fill-b {
            0% { fill: var(--c-flash-b); }
            100% { fill: var(--c-surface); }
        }
        .animate-flash-a {
            animation: flash-fill-a 0.4s ease-out forwards;
        }
        .animate-flash-b {
            animation: flash-fill-b 0.4s ease-out forwards;
        }

        /* Memphis "Hard Shadow" Utility - now theme-driven */
        .memphis-box {
            border: var(--c-border-width) solid var(--c-border);
            box-shadow: var(--c-shadow-offset) var(--c-shadow-offset) 0px 0px var(--c-shadow);
            border-radius: var(--c-radius);
            background-color: var(--c-surface);
            color: var(--c-text);
        }
        
        .memphis-input {
            border: var(--c-border-width) solid var(--c-border);
            box-shadow: 4px 4px 0px 0px var(--c-input-shadow);
            border-radius: var(--c-radius);
            background-color: var(--c-surface);
            color: var(--c-text);
        }
        .memphis-input:focus {
            outline: none;
            box-shadow: 4px 4px 0px 0px var(--c-accent-1);
        }

        .tap-btn {
            background-color: var(--c-invert-bg);
            color: var(--c-invert-text);
            border: 2px solid transparent;
            border-radius: var(--c-radius);
        }
        .tap-btn:hover { opacity: 0.85; }
        .tap-btn:active { background-color: var(--c-surface); color: var(--c-text); border-color: var(--c-border); }

        /* Utility for solid press effect (color inversion) */
        .btn-solid-press {
            transition: all 0.1s;
        }
        .btn-solid-press:active {
            background-color: var(--c-invert-bg) !important;
            color: var(--c-invert-text) !important;
            border-color: var(--c-invert-bg) !important;
        }
        /* Handle SVG fill inversion on press */
        .btn-solid-press:active svg {
            fill: var(--c-invert-text) !important;
        }

        .theme-swatch { transition: transform 0.1s; }
        .theme-swatch:hover { transform: translateY(-2px); }
    </style>
</head>
<body data-theme="terracotta" class="h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const IconWrapper = ({ children, size = 24, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Play = (p) => <IconWrapper {...p}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconWrapper>;
        const Pause = (p) => <IconWrapper {...p}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></IconWrapper>;
        const RotateCcw = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 3v9h9"></path></IconWrapper>;
        const Volume2 = (p) => <IconWrapper {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></IconWrapper>;
        const VolumeX = (p) => <IconWrapper {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></IconWrapper>;
        const Music = (p) => <IconWrapper {...p}><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></IconWrapper>;
        const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></IconWrapper>;
        const Repeat = (p) => <IconWrapper {...p}><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></IconWrapper>;
        const Hand = (p) => <IconWrapper {...p}><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></IconWrapper>;
        const Palette = (p) => <IconWrapper {...p}><path d="M12 3a9 9 0 1 0 0 18c.9 0 1.6-.7 1.6-1.6 0-.42-.16-.8-.43-1.09-.27-.29-.43-.66-.43-1.09 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8Z"></path><circle cx="6.5" cy="11.5" r="1.4"></circle><circle cx="9.5" cy="7.5" r="1.4"></circle><circle cx="14.5" cy="7.5" r="1.4"></circle><circle cx="17.5" cy="11.5" r="1.4"></circle></IconWrapper>;

        // --- Theme Catalog ---
        const THEMES = [
            { id: 'classic',    name: 'Classic pink',      tagline: 'The original Memphis look', swatch: ['#fff1f2', '#F472B6', '#22D3EE', '#FACC15'] },
            { id: 'midnight',   name: 'Midnight studio',   tagline: 'Dark canvas, electric accents', swatch: ['#14151C', '#A3E635', '#22D3EE', '#FB7185'] },
            { id: 'riso',       name: 'Risograph print',   tagline: 'Paper stock, fluorescent inks', swatch: ['#F4EFE3', '#FF48B0', '#0F7EC4', '#FFB627'] },
            { id: 'terracotta', name: 'Terracotta bauhaus',tagline: 'Warm, grown-up, geometric', swatch: ['#EDE3D2', '#C1543A', '#1F6F6B', '#E0A03C'] },
            { id: 'deepwater',  name: 'Deep water',        tagline: 'Calm, low-glare, rehearsal room', swatch: ['#101A2E', '#2DD4BF', '#818CF8', '#FDE68A'] },
        ];

        // --- Main App Component ---
        function CanonConductor() {
            // --- State ---
            const [bpm, setBpm] = useState(100);
            const [measures, setMeasures] = useState(8);
            const [timeSignature, setTimeSignature] = useState('4/4');
            const [groupCount, setGroupCount] = useState(3);
            const [metronomeStyle, setMetronomeStyle] = useState('accent'); 
            
            const [offsetValue, setOffsetValue] = useState(2); 
            const [offsetUnit, setOffsetUnit] = useState('measures'); 
            
            const [repeats, setRepeats] = useState(2);
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [highPitchAccent, setHighPitchAccent] = useState(true);

            // --- Theme State ---
            const [themeId, setThemeId] = useState('terracotta');
            const [showThemeMenu, setShowThemeMenu] = useState(false);
            const theme = THEMES.find(t => t.id === themeId) || THEMES[0];

            useEffect(() => {
                document.body.dataset.theme = themeId;
            }, [themeId]);

            // --- Playback State ---
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentBeat, setCurrentBeat] = useState(-1);
            const [smoothBeat, setSmoothBeat] = useState(-1);
            
            // --- Refs ---
            const audioContextRef = useRef(null);
            const nextNoteTimeRef = useRef(0);
            const timerIDRef = useRef(null);
            const beatCountRef = useRef(-1);
            const isPlayingRef = useRef(false);
            const animationFrameRef = useRef(null);
            const anchorTimeRef = useRef(0);
            const anchorBeatRef = useRef(0);
            const lastBpmRef = useRef(bpm);
            const tapTimesRef = useRef([]); 
            
            const bpmRef = useRef(bpm);
            const soundEnabledRef = useRef(soundEnabled);
            const metronomeStyleRef = useRef(metronomeStyle); 
            const highPitchAccentRef = useRef(highPitchAccent);
            
            useEffect(() => {
                soundEnabledRef.current = soundEnabled;
            }, [soundEnabled]);
            
            useEffect(() => {
                metronomeStyleRef.current = metronomeStyle;
            }, [metronomeStyle]);

            useEffect(() => {
                highPitchAccentRef.current = highPitchAccent;
            }, [highPitchAccent]);

            useEffect(() => {
                bpmRef.current = bpm; 

                if (isPlayingRef.current && audioContextRef.current) {
                    const now = audioContextRef.current.currentTime;
                    const timeElapsed = now - anchorTimeRef.current;
                    const prevBpmValue = lastBpmRef.current;
                    const beatsCovered = timeElapsed * (prevBpmValue / 60.0);
                    const currentBeatPos = anchorBeatRef.current + beatsCovered;
                    
                    anchorBeatRef.current = currentBeatPos;
                    anchorTimeRef.current = now;
                }
                
                lastBpmRef.current = bpm;
            }, [bpm]);

            const handleTap = () => {
                const now = performance.now();
                if (tapTimesRef.current.length > 0 && now - tapTimesRef.current[tapTimesRef.current.length - 1] > 2000) {
                    tapTimesRef.current = [];
                }
                tapTimesRef.current.push(now);
                if (tapTimesRef.current.length > 4) tapTimesRef.current.shift();
                
                if (tapTimesRef.current.length > 1) {
                    let totalInterval = 0;
                    for (let i = 1; i < tapTimesRef.current.length; i++) {
                        totalInterval += tapTimesRef.current[i] - tapTimesRef.current[i - 1];
                    }
                    const avgInterval = totalInterval / (tapTimesRef.current.length - 1);
                    if (avgInterval > 0) {
                        const newBpm = Math.round(60000 / avgInterval);
                        setBpm(Math.max(40, Math.min(200, newBpm)));
                    }
                }
            };

            const beatsPerMeasure = useMemo(() => {
                if (timeSignature === '6/8') return 2; 
                if (timeSignature === '2/4') return 2;
                if (timeSignature === '3/4') return 3;
                return 4; 
            }, [timeSignature]);

            const beatsPerLoop = measures * beatsPerMeasure;
            
            const offsetBeats = useMemo(() => {
                if (offsetUnit === 'measures') {
                    return offsetValue * beatsPerMeasure;
                }
                return offsetValue; 
            }, [offsetValue, offsetUnit, beatsPerMeasure]);
            
            const totalDurationBeats = ((groupCount - 1) * offsetBeats) + (beatsPerLoop * repeats);

            // Config ref: fixes a stale-closure bug where the scheduler and
            // animation loop kept using whatever measures/repeats/groups were
            // set when playback started, ignoring later changes.
            const configRef = useRef({ totalDurationBeats, beatsPerLoop });
            useEffect(() => {
                configRef.current = { totalDurationBeats, beatsPerLoop };
            }, [totalDurationBeats, beatsPerLoop]);

            const trackColors = theme.swatch.slice(1).length >= 4 ? theme.swatch.slice(1) : theme.swatch;

            const playClick = (beatNumber) => {
                if (!soundEnabledRef.current) return;
                
                if (!audioContextRef.current) return;
                const ctx = audioContextRef.current;
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();

                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                osc.type = 'square'; 

                const isDownbeat = beatNumber % beatsPerMeasure === 0;
                const isLoopStart = beatNumber >= 0 && beatNumber % beatsPerLoop === 0; 
                const isCountIn = beatNumber < 0;
                
                const isFlat = metronomeStyleRef.current === 'flat';

                if (isFlat) {
                    osc.frequency.value = 1000; 
                    gainNode.gain.value = 0.1;
                    osc.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.stop(ctx.currentTime + 0.05);
                } else {
                    const useAccent = highPitchAccentRef.current;
                    if (isCountIn) {
                        if (isDownbeat) {
                            osc.frequency.value = 880; 
                        } else {
                            osc.frequency.value = 660; 
                        }
                    } else if (useAccent && isLoopStart) {
                        osc.frequency.value = 1046.50; 
                    } else if (useAccent && isDownbeat) {
                        osc.frequency.value = 880; 
                    } else {
                        osc.frequency.value = 440; 
                    }

                    gainNode.gain.value = 0.1;
                    osc.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.stop(ctx.currentTime + 0.1);
                }
            };

            const schedule = () => {
                const lookahead = 25.0;
                const scheduleAheadTime = 0.1;

                if (!isPlayingRef.current) return;

                const ctx = audioContextRef.current; 
                const currentTime = ctx ? ctx.currentTime : 0;

                while (nextNoteTimeRef.current < currentTime + scheduleAheadTime) {
                    if (beatCountRef.current < configRef.current.totalDurationBeats) {
                        beatCountRef.current++;
                        setCurrentBeat(beatCountRef.current);
                        playClick(beatCountRef.current);
                        nextNoteTimeRef.current += (60.0 / bpmRef.current);
                    } else {
                        stop();
                        return;
                    }
                }
                timerIDRef.current = setTimeout(schedule, lookahead);
            };

            const animateVisuals = () => {
                if (!isPlayingRef.current || !audioContextRef.current) return;

                const ctx = audioContextRef.current;
                const currentTime = ctx.currentTime;
                
                const timeElapsed = currentTime - anchorTimeRef.current;
                const beatsElapsed = timeElapsed * (bpmRef.current / 60.0);
                
                const currentSmoothPos = anchorBeatRef.current + beatsElapsed;

                if (currentSmoothPos <= configRef.current.totalDurationBeats + 1) {
                    setSmoothBeat(currentSmoothPos);
                    animationFrameRef.current = requestAnimationFrame(animateVisuals);
                }
            };

            const start = () => {
                if (isPlayingRef.current) return;
                
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContextRef.current.state === 'suspended') {
                    audioContextRef.current.resume();
                }
                
                setIsPlaying(true);
                isPlayingRef.current = true;
                
                const nextNoteDelay = 0.1; 
                const ctxTime = audioContextRef.current.currentTime;

                // beatCountRef.current === -1 is the "fresh" sentinel set by reset().
                // Anything else means we're resuming from a pause, so we pick up
                // playback where it left off instead of restarting the count-in.
                const isFreshStart = beatCountRef.current === -1;

                if (isFreshStart) {
                    const countInLength = beatsPerMeasure; 
                    const startBeat = -1 - countInLength; 
                    
                    beatCountRef.current = startBeat; 
                    nextNoteTimeRef.current = ctxTime + nextNoteDelay;
                    anchorTimeRef.current = nextNoteTimeRef.current;
                    anchorBeatRef.current = startBeat + 1; 

                    setSmoothBeat(startBeat + 1);
                } else {
                    nextNoteTimeRef.current = ctxTime + nextNoteDelay;
                    anchorTimeRef.current = nextNoteTimeRef.current;
                    anchorBeatRef.current = beatCountRef.current;

                    setSmoothBeat(beatCountRef.current);
                }

                schedule();
                cancelAnimationFrame(animationFrameRef.current);
                animateVisuals();
            };

            const pause = () => {
                setIsPlaying(false);
                isPlayingRef.current = false;
                if (timerIDRef.current) clearTimeout(timerIDRef.current);
                if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
            };

            const reset = () => {
                pause();
                setCurrentBeat(-1);
                setSmoothBeat(-1);
                beatCountRef.current = -1;
            };
            
            const stop = () => {
                pause();
                setIsPlaying(false);
            };

            useEffect(() => {
                return () => { 
                    isPlayingRef.current = false;
                    if (timerIDRef.current) clearTimeout(timerIDRef.current); 
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                };
            }, []);

            const getGroupState = (groupIndex, beatValue) => {
                if (beatValue < 0) return { status: 'waiting', repetition: 0, beatInLoop: 0 };
                const startBeat = groupIndex * offsetBeats;
                const endBeat = startBeat + (beatsPerLoop * repeats);
                if (beatValue >= startBeat && beatValue < endBeat) {
                    const relativeBeat = beatValue - startBeat;
                    const repetition = Math.floor(relativeBeat / beatsPerLoop) + 1;
                    const beatInLoop = (relativeBeat % beatsPerLoop); 
                    return { status: 'singing', repetition, beatInLoop };
                }
                if (beatValue < startBeat) return { status: 'waiting' };
                return { status: 'done' };
            };

            const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
                const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
                return {
                    x: centerX + (radius * Math.cos(angleInRadians)),
                    y: centerY + (radius * Math.sin(angleInRadians))
                };
            };

            const describeDonutSegment = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
                const outerStart = polarToCartesian(x, y, outerRadius, startAngle);
                const outerEnd = polarToCartesian(x, y, outerRadius, endAngle);
                const innerStart = polarToCartesian(x, y, innerRadius, startAngle);
                const innerEnd = polarToCartesian(x, y, innerRadius, endAngle);
                let diff = endAngle - startAngle;
                if (diff < 0) { diff += 360; }
                if (diff >= 360) diff = 359.99;
                const largeArcFlag = diff > 180 ? "1" : "0";
                return [
                    "M", outerStart.x, outerStart.y,
                    "A", outerRadius, outerRadius, 0, largeArcFlag, 1, outerEnd.x, outerEnd.y,
                    "L", innerEnd.x, innerEnd.y,
                    "A", innerRadius, innerRadius, 0, largeArcFlag, 0, innerStart.x, innerStart.y,
                    "Z"
                ].join(" ");
            };

            const renderShape = (type, x, y, size, color) => {
                const half = size / 2;
                if (type === 'triangle') {
                    return <polygon points={`${x},${y-half} ${x+half},${y+half} ${x-half},${y+half}`} fill={color} stroke="var(--c-border)" strokeWidth="2" />;
                }
                if (type === 'square') {
                    return <rect x={x-half} y={y-half} width={size} height={size} fill={color} stroke="var(--c-border)" strokeWidth="2" />;
                }
                if (type === 'circle') {
                    return <circle cx={x} cy={y} r={half} fill={color} stroke="var(--c-border)" strokeWidth="2" />;
                }
                if (type === 'diamond') {
                    return <polygon points={`${x},${y-half} ${x+half},${y} ${x},${y+half} ${x-half},${y}`} fill={color} stroke="var(--c-border)" strokeWidth="2" />;
                }
                return null;
            };

            const renderCircularVisualizer = () => {
                const size = 600; 
                const center = size / 2;
                const maxRadius = size / 2 - 40; 
                const laneWidth = 40; 
                const gap = 20;

                let playheadAngle = 0;
                if (smoothBeat < 0) {
                    const countInProgress = (beatsPerMeasure + smoothBeat) / beatsPerMeasure;
                    playheadAngle = countInProgress * 360;
                } else {
                    const loopProgress = (smoothBeat % beatsPerLoop) / beatsPerLoop;
                    playheadAngle = loopProgress * 360;
                }

                let centerText = "0";
                let subText = "BEAT";
                
                if (currentBeat < 0) {
                    const countVal = (beatsPerMeasure + currentBeat) + 1;
                    centerText = countVal > 0 ? countVal : "READY";
                    subText = "READY";
                } else {
                    centerText = (currentBeat % beatsPerMeasure) + 1;
                    subText = "BEAT";
                }
                
                let pulseClass = "";
                if (isPlaying) {
                     if (metronomeStyle === 'flat') {
                         pulseClass = "animate-flash-b";
                     } else {
                         if (currentBeat < 0 || (currentBeat % beatsPerMeasure === 0)) {
                             pulseClass = "animate-flash-a";
                         } else {
                             pulseClass = "animate-flash-b";
                         }
                     }
                }

                return (
                    <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-h-[70vh]">
                        <g transform={`translate(${center}, ${center})`}>
                            <circle 
                                key={currentBeat} 
                                r="55" 
                                fill="var(--c-surface)" 
                                stroke="var(--c-border)" 
                                strokeWidth="4"
                                className={isPlaying ? pulseClass : ""}
                            />
                            
                            <text y="8" textAnchor="middle" className="font-bold text-4xl" fill="var(--c-text)" style={{ fontFamily: 'Space Grotesk' }}>
                                {centerText}
                            </text>
                            <text y="30" textAnchor="middle" className="text-xs font-bold tracking-widest uppercase" fill="var(--c-text)">
                                {subText}
                            </text>
                        </g>

                        {Array.from({ length: groupCount }).map((_, i) => {
                            const radius = maxRadius - (i * (laneWidth + gap));
                            const startBeat = i * offsetBeats;
                            const endBeat = startBeat + (beatsPerLoop * repeats);
                            const isSinging = (smoothBeat >= startBeat && smoothBeat < endBeat);
                            const groupState = getGroupState(i, smoothBeat);

                            const color = trackColors[i % trackColors.length];
                            const shapes = ['triangle', 'circle', 'square', 'diamond'];
                            const shape = shapes[i % shapes.length];

                            const startBeatInLoop = (startBeat % beatsPerLoop);
                            const startAngle = (startBeatInLoop / beatsPerLoop) * 360;
                            const startPos = polarToCartesian(center, center, radius, startAngle);

                            const rOuter = radius + (laneWidth / 2);
                            const rInner = radius - (laneWidth / 2);

                            // Calculate measure lines for this specific track
                            const measureLines = [];
                            if (isSinging) {
                                const sungBeats = groupState.beatInLoop;
                                const completedMeasures = Math.floor(sungBeats / beatsPerMeasure);
                                
                                // Only draw lines every X measure if there are too many to keep it clean
                                const step = measures > 16 ? 2 : 1;

                                for (let m = 1; m <= completedMeasures; m += step) {
                                    const beatOffset = m * beatsPerMeasure;
                                    const angleOffset = (beatOffset / beatsPerLoop) * 360;
                                    const lineAngle = startAngle + angleOffset;
                                    
                                    const p1 = polarToCartesian(center, center, rInner, lineAngle);
                                    const p2 = polarToCartesian(center, center, rOuter, lineAngle);
                                    
                                    measureLines.push(
                                        <line 
                                            key={m}
                                            x1={p1.x} y1={p1.y} 
                                            x2={p2.x} y2={p2.y} 
                                            stroke="var(--c-border)" 
                                            strokeOpacity="0.3"
                                            strokeWidth="2"
                                        />
                                    );
                                }
                            }

                            return (
                                <g key={i}>
                                    <circle cx={center} cy={center} r={radius} fill="none" stroke="var(--c-track-idle)" strokeWidth="1.5" strokeDasharray="4 4" />
                                    
                                    {isSinging && (
                                        <path 
                                            d={describeDonutSegment(center, center, rInner, rOuter, startAngle, playheadAngle)} 
                                            fill={color} 
                                            stroke="var(--c-border)"
                                            strokeWidth="3"
                                        />
                                    )}
                                    
                                    {/* Measure Divider Lines Overlay */}
                                    {measureLines}

                                    <g transform={`translate(${startPos.x}, ${startPos.y})`}>
                                        {renderShape(shape, 0, 0, 24, isSinging ? color : 'var(--c-track-idle)')}
                                        <text y="4" textAnchor="middle" fontSize="12" fontWeight="bold" fill="var(--c-on-accent)">{i + 1}</text>
                                    </g>

                                    {isSinging && (
                                        <g transform={`rotate(${playheadAngle} ${center} ${center})`}>
                                            <g transform={`translate(0, ${-radius})`}>
                                                <circle r="16" fill="var(--c-surface)" stroke="var(--c-border)" strokeWidth="2" />
                                                <text y="4" textAnchor="middle" fontSize="14" fontWeight="bold" fill="var(--c-text)" transform={`rotate(${-playheadAngle})`}>
                                                    {groupState.repetition}
                                                </text>
                                            </g>
                                        </g>
                                    )}
                                </g>
                            );
                        })}

                        <line 
                            x1={center} y1={center} 
                            x2={center} y2={20} 
                            stroke={currentBeat < 0 ? "var(--c-flash-a)" : "var(--c-border)"} 
                            strokeWidth="4" 
                            transform={`rotate(${playheadAngle} ${center} ${center})`} 
                        />
                    </svg>
                );
            };

            return (
                <div className="flex flex-col h-full font-sans relative z-10" style={{ color: 'var(--c-text)' }}>
                    <header className="p-4 flex items-center justify-between sticky top-0 z-50" style={{ backgroundColor: 'var(--c-surface)', borderBottom: '4px solid var(--c-border)' }}>
                        <div className="flex items-center gap-3">
                            <div className="p-2" style={{ backgroundColor: 'var(--c-badge)', border: '2px solid var(--c-border)', boxShadow: '3px 3px 0px 0px var(--c-border)', borderRadius: 'var(--c-radius)', color: 'var(--c-on-accent)' }}>
                                <Music size={28} />
                            </div>
                            <h1 className="text-2xl font-black uppercase tracking-tight">Round Helper</h1>
                        </div>
                        <div className="flex items-center gap-2 relative">
                            <button 
                                onClick={() => setShowThemeMenu(v => !v)}
                                className="p-3 btn-solid-press"
                                style={{ backgroundColor: 'var(--c-surface)', border: '2px solid var(--c-border)', boxShadow: '3px 3px 0px 0px var(--c-border)', borderRadius: 'var(--c-radius)' }}
                                aria-label="Choose color theme"
                            >
                                <Palette size={24} />
                            </button>
                            <button 
                                onClick={() => setSoundEnabled(!soundEnabled)}
                                className="p-3 btn-solid-press"
                                style={{ backgroundColor: soundEnabled ? 'var(--c-sound-on)' : 'var(--c-sound-off)', border: '2px solid var(--c-border)', boxShadow: '3px 3px 0px 0px var(--c-border)', borderRadius: 'var(--c-radius)', color: 'var(--c-on-accent)' }}
                            >
                                {soundEnabled ? <Volume2 size={24} /> : <VolumeX size={24} />}
                            </button>

                            {showThemeMenu && (
                                <div 
                                    className="absolute top-full right-0 mt-2 p-3 z-50 w-72"
                                    style={{ backgroundColor: 'var(--c-surface)', border: 'var(--c-border-width) solid var(--c-border)', boxShadow: 'var(--c-shadow-offset) var(--c-shadow-offset) 0px 0px var(--c-shadow)', borderRadius: 'var(--c-radius)' }}
                                >
                                    <p className="text-xs font-bold tracking-widest mb-2" style={{ color: 'var(--c-text-soft, var(--c-text))' }}>COLOR THEME</p>
                                    <div className="flex flex-col gap-1">
                                        {THEMES.map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => { setThemeId(t.id); setShowThemeMenu(false); }}
                                                className="theme-swatch flex items-center gap-3 p-2 text-left"
                                                style={{
                                                    borderRadius: 'var(--c-radius)',
                                                    border: t.id === themeId ? '2px solid var(--c-border)' : '2px solid transparent',
                                                    backgroundColor: t.id === themeId ? 'var(--c-track-idle)' : 'transparent'
                                                }}
                                            >
                                                <span className="flex -space-x-1 shrink-0">
                                                    {t.swatch.map((c, idx) => (
                                                        <span key={idx} className="w-5 h-5 rounded-full" style={{ backgroundColor: c, border: '2px solid var(--c-surface)' }}></span>
                                                    ))}
                                                </span>
                                                <span className="flex flex-col">
                                                    <span className="text-sm font-bold">{t.name}</span>
                                                    <span className="text-[11px]" style={{ opacity: 0.7 }}>{t.tagline}</span>
                                                </span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto lg:overflow-hidden flex flex-col lg:flex-row gap-8 p-6 max-w-7xl mx-auto w-full">
                        
                        <div className="w-full lg:w-1/3 flex flex-col gap-6 overflow-y-auto pr-2">
                            <div className="p-6 memphis-box relative">
                                <div className="absolute -top-4 -right-4 w-12 h-12 rounded-full z-0" style={{ backgroundColor: 'var(--c-decor)', border: '2px solid var(--c-border)' }}></div>
                                
                                <h2 className="text-xl font-bold mb-6 flex items-center gap-2 relative z-10">
                                    <Settings size={24} /> SETUP
                                </h2>
                                
                                <div className="space-y-6 relative z-10">
                                    <div className="space-y-2">
                                        <div className="flex justify-between font-bold items-center">
                                            <label>TEMPO</label>
                                            <div className="flex gap-2 items-center">
                                                <button 
                                                    onClick={handleTap}
                                                    className="tap-btn text-xs px-3 py-1 font-bold tracking-widest transition-colors"
                                                >
                                                    TAP
                                                </button>
                                                <span className="px-2" style={{ backgroundColor: 'var(--c-invert-bg)', color: 'var(--c-invert-text)', borderRadius: 'var(--c-radius)' }}>{bpm} BPM</span>
                                            </div>
                                        </div>
                                        <input 
                                            type="range" min="40" max="200" value={bpm} 
                                            onChange={(e) => setBpm(Number(e.target.value))}
                                            className="w-full h-4 rounded-none border-2 appearance-none"
                                            style={{ backgroundColor: 'var(--c-input-shadow)', borderColor: 'var(--c-border)', accentColor: 'var(--c-accent-1)' }}
                                        />
                                        
                                        <div className="flex items-center justify-end mt-2 gap-2">
                                            <span className="text-[10px] font-bold tracking-wider">CLICK:</span>
                                            <div className="flex" style={{ border: '2px solid var(--c-border)', backgroundColor: 'var(--c-surface)', borderRadius: 'var(--c-radius)' }}>
                                                <button 
                                                    onClick={() => setMetronomeStyle('accent')}
                                                    className="px-2 py-0.5 text-[10px] font-bold tracking-wider"
                                                    style={{ backgroundColor: metronomeStyle === 'accent' ? 'var(--c-invert-bg)' : 'transparent', color: metronomeStyle === 'accent' ? 'var(--c-invert-text)' : 'var(--c-text)' }}
                                                >
                                                    ACCENT
                                                </button>
                                                <div className="w-[2px]" style={{ backgroundColor: 'var(--c-border)' }}></div>
                                                <button 
                                                    onClick={() => setMetronomeStyle('flat')}
                                                    className="px-2 py-0.5 text-[10px] font-bold tracking-wider"
                                                    style={{ backgroundColor: metronomeStyle === 'flat' ? 'var(--c-invert-bg)' : 'transparent', color: metronomeStyle === 'flat' ? 'var(--c-invert-text)' : 'var(--c-text)' }}
                                                >
                                                    FLAT
                                                </button>
                                            </div>
                                        </div>
                                        {metronomeStyle === 'accent' && (
                                            <label className="flex items-center justify-end gap-2 text-[10px] font-bold tracking-wider mt-1 cursor-pointer select-none">
                                                HIGH ACCENT ON DOWNBEATS
                                                <input
                                                    type="checkbox"
                                                    checked={highPitchAccent}
                                                    onChange={(e) => setHighPitchAccent(e.target.checked)}
                                                    className="w-4 h-4"
                                                    style={{ accentColor: 'var(--c-accent-1)' }}
                                                />
                                            </label>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold block mb-1">TIME SIG</label>
                                            <select value={timeSignature} onChange={(e) => setTimeSignature(e.target.value)} className="w-full p-2 memphis-input font-bold text-lg">
                                                <option value="2/4">2/4</option>
                                                <option value="3/4">3/4</option>
                                                <option value="4/4">4/4</option>
                                                <option value="6/8">6/8</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold block mb-1"># OF MEASURES</label>
                                            <input type="number" min="1" max="32" value={measures} onChange={(e) => setMeasures(Number(e.target.value))} className="w-full p-2 memphis-input font-bold text-lg" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold block mb-1">GROUPS</label>
                                            <select value={groupCount} onChange={(e) => setGroupCount(Number(e.target.value))} className="w-full p-2 memphis-input font-bold text-lg">
                                                <option value="2">2</option>
                                                <option value="3">3</option>
                                                <option value="4">4</option>
                                            </select>
                                        </div>
                                        
                                        <div className="flex flex-col">
                                            <div className="flex justify-between items-baseline mb-1">
                                                <label className="text-xs font-bold">ENTER AFTER</label>
                                            </div>
                                            <div className="flex items-stretch h-12 memphis-input p-0">
                                                <input 
                                                    type="number" 
                                                    min="1" 
                                                    step="1" 
                                                    value={offsetValue} 
                                                    onChange={(e) => setOffsetValue(Math.max(1, Math.floor(Number(e.target.value))))}
                                                    className="w-16 p-2 text-lg font-bold outline-none text-center bg-transparent"
                                                    style={{ borderRight: '2px solid var(--c-border)', color: 'var(--c-text)' }}
                                                />
                                                <div className="flex-1 flex flex-col">
                                                    <button 
                                                        onClick={() => setOffsetUnit('measures')}
                                                        className="flex-1 text-[10px] font-bold tracking-wider"
                                                        style={{ backgroundColor: offsetUnit === 'measures' ? 'var(--c-invert-bg)' : 'transparent', color: offsetUnit === 'measures' ? 'var(--c-invert-text)' : 'var(--c-text)' }}
                                                    >
                                                        MEAS
                                                    </button>
                                                    <div className="h-[2px]" style={{ backgroundColor: 'var(--c-border)' }}></div>
                                                    <button 
                                                        onClick={() => setOffsetUnit('beats')}
                                                        className="flex-1 text-[10px] font-bold tracking-wider"
                                                        style={{ backgroundColor: offsetUnit === 'beats' ? 'var(--c-invert-bg)' : 'transparent', color: offsetUnit === 'beats' ? 'var(--c-invert-text)' : 'var(--c-text)' }}
                                                    >
                                                        BEATS
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="text-xs font-bold block mb-1">TOTAL REPEATS</label>
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => setRepeats(Math.max(1, repeats - 1))} className="w-10 h-10 font-bold text-xl btn-solid-press" style={{ backgroundColor: 'var(--c-surface)', border: '2px solid var(--c-border)', borderRadius: 'var(--c-radius)' }}>-</button>
                                            <span className="font-black text-2xl w-8 text-center">{repeats}</span>
                                            <button onClick={() => setRepeats(repeats + 1)} className="w-10 h-10 font-bold text-xl btn-solid-press" style={{ backgroundColor: 'var(--c-surface)', border: '2px solid var(--c-border)', borderRadius: 'var(--c-radius)' }}>+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="p-6 memphis-box flex items-center justify-around" style={{ backgroundColor: 'var(--c-bar)', color: 'var(--c-on-accent)' }}>
                                <button 
                                    onClick={reset}
                                    className="flex flex-col items-center gap-1 group"
                                >
                                    <div className="p-3 btn-solid-press" style={{ backgroundColor: 'var(--c-surface)', border: '2px solid var(--c-border)', boxShadow: '4px 4px 0px 0px var(--c-border)', borderRadius: 'var(--c-radius)', color: 'var(--c-text)' }}>
                                        <RotateCcw size={24} />
                                    </div>
                                    <span className="text-xs font-bold mt-1">RESET</span>
                                </button>

                                <button 
                                    onClick={isPlaying ? pause : start}
                                    className={`w-20 h-20 flex items-center justify-center btn-solid-press ${!isPlaying ? 'animate-wiggle' : ''}`}
                                    style={{ border: '4px solid var(--c-border)', boxShadow: '6px 6px 0px 0px var(--c-border)', borderRadius: 'var(--c-radius)', backgroundColor: isPlaying ? 'var(--c-play-active)' : 'var(--c-play-idle)', color: 'var(--c-on-accent)' }}
                                >
                                    {isPlaying ? <Pause size={40} fill="var(--c-on-accent)" /> : <Play size={40} fill="var(--c-on-accent)" className="ml-1" />}
                                </button>
                            </div>
                        </div>

                        <div className="w-full lg:w-2/3 memphis-box p-4 flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'linear-gradient(var(--c-border) 1px, transparent 1px), linear-gradient(90deg, var(--c-border) 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                            
                            {renderCircularVisualizer()}
                            
                            <div className="absolute bottom-4 right-4 px-2 py-1 text-xs font-bold" style={{ backgroundColor: 'var(--c-invert-bg)', color: 'var(--c-invert-text)', border: '2px solid var(--c-invert-text)', borderRadius: 'var(--c-radius)' }}>
                                DURATION: {totalDurationBeats} BEATS
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CanonConductor />);
    </script>
<script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="musicaldrewby" data-color="#FFDD00" data-emoji=""  data-font="Cookie" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
</body>
</html>
