name: Import additional app source projects
on:
  push:
    branches: [migration/additional-apps-2026-10-25]
    paths:
      - migration/additional-apps-manifest.json
      - migration/import_additional_apps.py
      - .github/workflows/import-additional-apps.yml
permissions:
  contents: write
concurrency:
  group: additional-app-import-20261025
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/additional-apps-2026-10-25
          fetch-depth: 1
      - name: Import and verify all project files
        run: python3 migration/import_additional_apps.py
      - name: Commit the verified projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pack.window 0
          git config pack.compression 1
          git add --force additional-apps/
          if ! git diff --cached --quiet; then
            git commit -m "Add 26 additional app projects for AI Studio import; preserve arcade index"
            git push origin HEAD:migration/additional-apps-2026-10-25
          fi
